#cloud-config

users:
  - name: ${vm_username}
    ssh-authorized-keys:
      - ${ssh_public_key}
    groups: ['sudo']
    shell: /bin/bash
    sudo: ["ALL=(ALL) NOPASSWD:ALL"]
locale: en_US.UTF-8
timezone: US/East
apt:
  sources:
    tailscale.list:
      source: deb https://pkgs.tailscale.com/stable/ubuntu noble main
      # curl -fsSL https://pkgs.tailscale.com/stable/ubuntu/noble.noarmor.gpg | gpg --show-keys
      keyid: 2596A99EAAB33821893C0A79458CA832957F5868
package_update: true
package_upgrade: true
packages:
  - tailscale

write_files:
  - content: |
      net.ipv4.ip_forward=1
      net.ipv6.conf.all.forwarding=1
    path: /etc/sysctl.d/99-tailscale.conf
    permissions: '0644'


runcmd:
  - sysctl -p /etc/sysctl.d/99-tailscale.conf
  - tailscale up --advertise-exit-node --authkey ${tailscale_auth_key}